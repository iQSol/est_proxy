
[DEFAULT]
debug: False
connection_log: False

[Logging]
log_format: '%(asctime)s - est_proxy - %(levelname)s - %(message)s'

[Daemon]
# This can be kept like this.
address = 0.0.0.0
port = 9443
key_file = /usr/local/est_proxy/data/certs/est-srv.key.pem
cert_file = /usr/local/est_proxy/data/certs/est-srv.crt.pem

[CAhandler]
# Only these options exist. For more information on what they mean, visit:
# https://github.com/grindsa/acme2certifier/blob/master/docs/mswcce.md
handler_file: examples/ca_handler/mswcce_ca_handler.py
host: <ip/dns_of_ca>
user: <ca_user>
password: <ca_password>
ca_bundle: /usr/local/est_proxy/data/bundle.pem
target_domain: <target_domain>
domain_controller: <domain_controller>
ca_name: <ca_name>
use_kerberos: False

# Only needed if you have users with auth_backend "radius" in the est_proxy database.
# Users with auth_backend "local" are unaffected and keep using their locally stored password hash.
# Keys left empty (e.g. "server:") are treated as unset.
# "enabled" is an explicit switch: set it to False to turn RADIUS off without
# removing the rest of the section. Missing or empty counts as enabled.
# [RADIUS]
# enabled: True
# server: <ip/dns_of_radius_server>
# secret: <radius_shared_secret>
# port: 1812
# timeout: 5
# retries: 1
# nas_identifier: est_proxy
#
# proto selects the transport: "udp" (default, plain RADIUS) or "radsec" (RADIUS over TLS, RFC 6614).
# proto: udp
#
# The following only apply when proto = radsec. RadSec uses TCP (default port 2083) and mutual TLS;
# "secret" defaults to the RFC-mandated value "radsec" and only needs to be set if your server
# expects a different one. certfile/keyfile are the client
# certificate presented to the RADIUS server; certfile_server is the CA that verifies the server cert.
# RadSec negotiates TLS 1.3 by default; set min_tls_version: 1.2 for legacy servers. To trust a server
# certificate whose name does not match the configured server, set check_hostname: False.
# proto: radsec
# port: 2083
# certfile_server: /usr/local/est_proxy/data/certs/radsec-ca.pem
# certfile: /usr/local/est_proxy/data/certs/radsec-client.crt.pem
# keyfile: /usr/local/est_proxy/data/certs/radsec-client.key.pem
# check_hostname: True
# min_tls_version: 1.3

# CSR validation. subjectAltName is always validated and forwarded; every other
# X.509v3 extension in a CSR is rejected unless listed here. The default lists the
# extensions a Microsoft AD CS template overrides from the CSR anyway
# (keyUsage/extendedKeyUsage/basicConstraints), so common clients (e.g. FortiGate)
# that add them by default are not rejected.
#
# WARNING: do NOT add certificatePolicies unless you know your CA strips it. An
# MS-WCCE CA copies certificatePolicies from the CSR verbatim (OID, anyPolicy and
# CPS/userNotice qualifiers), so listing it lets an authenticated client inject
# arbitrary policy assertions into the issued certificate. Names are
# case-insensitive; a raw dotted OID (e.g. 2.5.29.37) also works.
# [CSRvalidation]
# allowed_extensions: keyUsage, extendedKeyUsage, basicConstraints